name: L1 DocJev synthetic packet splitting

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight is local; live calls Jev and may consume OpenRouter credits"
        required: true
        type: choice
        options: [preflight, live]
        default: preflight

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: evaluation
    env:
      PYTHONPATH: docjev-upstream/src
      TYPESAFE_BASE_URL: https://openrouter.ai/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin upstream DocJev
        run: |
          git clone --quiet https://github.com/jerryjliu/docjev.git docjev-upstream
          git -C docjev-upstream checkout --detach c7abe276a970605feb9cb8b27513365b6c10726e
          test "$(git -C docjev-upstream rev-parse HEAD)" = c7abe276a970605feb9cb8b27513365b6c10726e
      - name: Install DocJev and synthetic fixture generator
        run: python -m pip install ./docjev-upstream 'reportlab>=4,<5'
      - name: Run zero-network benchmark tests
        run: python -m unittest discover -s scripts -p 'test_docjev_splitting.py'
      - name: Evaluate synthetic packet boundaries
        env:
          TYPESAFE_API_KEY: ${{ inputs.mode == 'live' && secrets.OPENROUTER_API_KEY || '' }}
        run: |
          python scripts/docjev-splitting-benchmark.py \
            --docjev-root docjev-upstream --mode "${{ inputs.mode }}"
